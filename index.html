<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>WebSocket Test</title>
</head>

<body>
    <h1>WebSocket Test</h1>

    <button onclick="connectWS()">Connect</button>
    <button onclick="sendMsg()">Send Message</button>

    <pre id="log"></pre>

    <script>
        let ws;
        const log = document.getElementById("log");

        function write(msg) {
            log.textContent += msg + "\n";
        }

        function connectWS() {
            ws = new WebSocket("wss://server.learnwithchampak.live/");

            ws.onopen = () => {
                write("CONNECTED");
                ws.send("Hello from browser");
            };

            ws.onmessage = event => {
                write("MESSAGE: " + event.data);
            };

            ws.onerror = event => {
                write("ERROR: WebSocket error");
                console.error(event);
            };

            ws.onclose = event => {
                write("CLOSED: code=" + event.code + " reason=" + event.reason);
            };
        }

        function sendMsg() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                write("Not connected");
                return;
            }

            ws.send("Manual message at " + new Date().toLocaleTimeString());
        }
    </script>
</body>

</html>
